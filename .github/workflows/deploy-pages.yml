# Official GitHub Pages artifact deploy (replaces peaceiris/gh-pages loop).
# REQUIRED: Settings → Pages → Source = "GitHub Actions"
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site artifact
        run: |
          mkdir publish
          shopt -s dotglob nullglob
          for path in * .*; do
            case "$path" in
              .|..|.git|.github|.cursor|publish) continue ;;
            esac
            cp -a "$path" publish/
          done
          ls -la publish

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
